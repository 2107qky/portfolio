<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nguyễn Quốc Kỳ - Portfolio</title>
  <style>
    /* Nền hiệu ứng */
    body, html {
      margin: 0; padding: 0;
      height: 100%;
      background: radial-gradient(circle at center, #0d0d0d, #000000);
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    /* Hiệu ứng bong bóng */
    .bubbles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .bubble {
      position: absolute;
      bottom: -100px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      animation: rise 10s linear infinite;
      opacity: 0.6;
    }
    @keyframes rise {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.6;
      }
      100% {
        transform: translateY(-110vh) scale(1.5);
        opacity: 0;
      }
    }

    /* Container chính */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 400px;
      padding: 20px;
      background: rgba(0,0,0,0.5);
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(255,255,255,0.1);
    }

    /* Avatar */
    .avatar {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      margin-bottom: 20px;
      box-shadow: 0 0 15px #ff1a1a;
      transition: transform 0.3s ease;
    }
    .avatar:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px #ff4d4d;
    }

    /* Tên */
    h1 {
      margin: 0 0 10px;
      font-size: 2.5em;
      letter-spacing: 2px;
    }

    /* Mô tả */
    p {
      font-size: 1.1em;
      color: #ddd;
      margin-bottom: 25px;
    }

    /* Social links */
    .socials {
      display: flex;
      justify-content: center;
      gap: 25px;
    }
    .socials a {
      color: white;
      font-size: 1.8em;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    .socials a:hover {
      color: #ff3333;
    }
  </style>

  <!-- Font Awesome để có icon social -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="bubbles">
    <!-- Tạo nhiều bong bóng với kích thước, vị trí và thời gian ngẫu nhiên -->
    <div class="bubble" style="width: 30px; height: 30px; left: 10%; animation-delay: 0s;"></div>
    <div class="bubble" style="width: 15px; height: 15px; left: 25%; animation-delay: 2s;"></div>
    <div class="bubble" style="width: 40px; height: 40px; left: 40%; animation-delay: 4s;"></div>
    <div class="bubble" style="width: 20px; height: 20px; left: 55%; animation-delay: 1.5s;"></div>
    <div class="bubble" style="width: 35px; height: 35px; left: 70%; animation-delay: 3.5s;"></div>
    <div class="bubble" style="width: 25px; height: 25px; left: 85%; animation-delay: 2.5s;"></div>
  </div>

  <div class="container">
    <img class="avatar" src="8ac8cc9b-b063-493f-89bd-ad8aa46c4e8e.png" alt="Nguyễn Quốc Kỳ" />
    <h1>Nguyễn Quốc Kỳ</h1>
    <p>Chào mừng bạn đến với trang cá nhân của tôi! Tôi đam mê lập trình và thiết kế web.</p>

    <div class="socials">
      <a href="https://www.facebook.com/KyCuccc/" target="_blank" title="Facebook"><i class="fab fa-facebook"></i></a>
      <a href="https://www.instagram.com/kra_quocky/" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://www.tiktok.com/@kyria2117" target="_blank" title="TikTok"><i class="fab fa-tiktok"></i></a>
    </div>
  </div>

</body>
</html>

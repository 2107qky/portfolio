
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguyễn Quốc Kỳ</title>
    <style>
        /* Reset cơ bản */
        * { margin:0; padding:0; box-sizing:border-box; }

        body, html {
            height: 100%;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        /* Canvas nền */
        #bg {
            position: fixed;
            top:0;
            left:0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Phần nội dung */
        .content {
            position: absolute;
            top:50%;
            left:50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .avatar {
            width:150px;
            height:150px;
            border-radius:50%;
            border: 4px solid white;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <!-- Canvas nền -->
    <canvas id="bg"></canvas>

    <!-- Nội dung chính -->
    <div class="content">
        <img class="avatar" src="avatar.png" alt="Nguyễn Quốc Kỳ">
        <h1>Nguyễn Quốc Kỳ</h1>
        <p>Chào mừng đến với trang cá nhân của tôi</p>
    </div>

    <!-- Hiệu ứng nền particles -->
    <script>
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const colors = ["#ff4d4d", "#4d79ff", "#4dff88", "#ffcc00"];

        for(let i=0;i<120;i++){
            particles.push({
                x: Math.random()*canvas.width,
                y: Math.random()*canvas.height,
                r: Math.random()*3+1,
                dx: (Math.random()-0.5)*1.5,
                dy: (Math.random()-0.5)*1.5,
                color: colors[Math.floor(Math.random()*colors.length)]
            });
        }

        function animate(){
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach(p=>{
                ctx.beginPath();
                ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
                ctx.fillStyle = p.color;
                ctx.fill();

                p.x += p.dx;
                p.y += p.dy;

                if(p.x>canvas.width) p.x=0;
                if(p.x<0) p.x=canvas.width;
                if(p.y>canvas.height) p.y=0;
                if(p.y<0) p.y=canvas.height;
            });
            requestAnimationFrame(animate);
        }
        animate();

        // Resize canvas khi thay đổi kích thước màn hình
        window.addEventListener('resize',()=>{
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>

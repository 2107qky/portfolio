
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nguyễn Quốc Kỳ - Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    /* Reset & base */
    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container {
      background: #272727;
      padding: 40px 30px;
      border-radius: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      max-width: 380px;
      width: 100%;
    }
    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #38b2ac; /* turquoise */
      margin: 0 auto 25px auto;
      animation: float 3s ease-in-out infinite;
      display: block;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    h1 {
      font-weight: 700;
      font-size: 2.8rem;
      color: #38b2ac;
      margin-bottom: 8px;
    }
    p.description {
      font-weight: 400;
      font-size: 1.1rem;
      color: #ccc;
      margin-bottom: 28px;
    }
    .links a {
      display: inline-block;
      margin: 0 10px;
      padding: 10px 22px;
      border-radius: 30px;
      background-color: #38b2ac;
      color: #1a1a1a;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.3s ease, color 0.3s ease;
      box-shadow: 0 4px 8px rgba(56, 178, 172, 0.5);
    }
    .links a:hover {
      background-color: #2c7a7b;
      color: #e6fffa;
      box-shadow: 0 6px 14px rgba(44, 122, 123, 0.7);
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="avatar" src="avatar.png" alt="Nguyễn Quốc Kỳ" />
    <h1>Nguyễn Quốc Kỳ</h1>
    <p class="description">Front-end Developer • React • TypeScript</p>
    <div class="links">
      <a href="https://github.com/2107qky" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://www.linkedin.com/in/yourprofile" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="mailto:youremail@example.com">Email</a>
    </div>
  </div>
</body>
</html>
